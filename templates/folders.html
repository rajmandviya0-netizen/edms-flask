<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folder Management | EDMS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e293b;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 27px;
        }

        .subtitle {
            color: #64748b;
            margin-top: 7px;
        }

        button {
            border: none;
            padding: 11px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e2e8f0;
            color: #1e293b;
        }

        .danger {
            background: #fee2e2;
            color: #b91c1c;
        }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 3px 12px #0f172a0c;
        }

        .folder-list {
            margin-top: 20px;
        }

        .folder {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 15px 10px;
            border-bottom: 1px solid #e5e7eb;
        }

        .folder.child {
            border-left: 3px solid #bfdbfe;
        }

        .folder-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .folder-icon {
            font-size: 25px;
        }

        .folder-name {
            font-weight: 700;
        }

        .folder-meta {
            font-size: 12px;
            color: #64748b;
            margin-top: 5px;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .actions button {
            padding: 8px 12px;
            font-size: 13px;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 40px 10px;
        }

        .message {
            margin: 15px 0;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .65);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            background: white;
            width: 440px;
            max-width: 100%;
            padding: 24px;
            border-radius: 12px;
        }

        .modal-box h3 {
            margin-bottom: 6px;
        }

        .modal-box p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 14px;
            overflow-wrap: anywhere;
        }

        .modal-box select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: white;
            margin-bottom: 18px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        @media(max-width: 600px) {
            body {
                padding: 15px;
            }

            .folder {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <div>
            <h1>📁 Folder Management</h1>
            <p class="subtitle">Organize and manage your enterprise documents.</p>
        </div>

        <div class="actions">
            <button class="secondary" onclick="goDashboard()">
                Dashboard
            </button>
            <button class="primary" onclick="createFolder(null)">
                + Create Folder
            </button>
        </div>
    </div>

    <div id="message" class="message"></div>

    <div class="panel">
        <h3>All Folders</h3>
        <div id="folderList" class="folder-list">
            <div class="empty">Loading folders...</div>
        </div>
    </div>

</div>

<div class="modal" id="moveModal">
    <div class="modal-box">
        <h3>Move Folder</h3>
        <p id="moveFolderName"></p>
        <select id="moveParent"></select>
        <div class="modal-actions">
            <button class="secondary" onclick="closeMove()">Cancel</button>
            <button class="primary" id="moveConfirm" onclick="confirmMove()">Move Here</button>
        </div>
    </div>
</div>

<script>
    const folderList = document.getElementById("folderList");
    const messageBox = document.getElementById("message");
    const moveModal = document.getElementById("moveModal");
    const moveParent = document.getElementById("moveParent");

    let allFolders = [];
    let movingFolderId = null;

    function showMessage(message, type) {
        messageBox.textContent = message;
        messageBox.className = "message " + type;
        messageBox.style.display = "block";
    }

    function goDashboard() {
        window.location.href = "/";
    }

    // ---------- helpers for the folder tree ----------

    function buildMaps() {
        const byId = new Map(allFolders.map(f => [f.id, f]));
        const children = new Map();

        allFolders.forEach(folder => {
            const hasParent =
                folder.parent_id !== null && byId.has(folder.parent_id);
            const key = hasParent ? folder.parent_id : null;

            if (!children.has(key)) {
                children.set(key, []);
            }

            children.get(key).push(folder);
        });

        return { byId, children };
    }

    function pathOf(folderId, byId) {
        const names = [];
        const seen = new Set();
        let current = byId.get(folderId);

        while (current && !seen.has(current.id)) {
            seen.add(current.id);
            names.unshift(current.name);
            current = byId.get(current.parent_id);
        }

        return names.join(" / ");
    }

    function getDescendantIds(folderId, children) {
        const result = new Set();
        const queue = [folderId];

        while (queue.length) {
            const id = queue.shift();

            (children.get(id) || []).forEach(child => {
                if (!result.has(child.id)) {
                    result.add(child.id);
                    queue.push(child.id);
                }
            });
        }

        return result;
    }

    // ---------- drawing ----------

    function buildFolderRow(folder, depth) {
        const item = document.createElement("div");
        item.className = "folder" + (depth > 0 ? " child" : "");
        item.style.marginLeft = (depth * 28) + "px";

        const info = document.createElement("div");
        info.className = "folder-info";

        const icon = document.createElement("span");
        icon.className = "folder-icon";
        icon.textContent = "📁";

        const details = document.createElement("div");

        const name = document.createElement("div");
        name.className = "folder-name";
        name.textContent = folder.name;

        const meta = document.createElement("div");
        meta.className = "folder-meta";
        meta.textContent =
            `${folder.document_count} documents · ${folder.subfolder_count} subfolders`;

        details.append(name, meta);
        info.append(icon, details);

        const actions = document.createElement("div");
        actions.className = "actions";

        const subButton = document.createElement("button");
        subButton.className = "secondary";
        subButton.textContent = "+ Subfolder";
        subButton.addEventListener("click", () => createFolder(folder.id));

        const renameButton = document.createElement("button");
        renameButton.className = "secondary";
        renameButton.textContent = "Rename";
        renameButton.addEventListener("click", () => renameFolder(folder.id, folder.name));

        const moveButton = document.createElement("button");
        moveButton.className = "secondary";
        moveButton.textContent = "Move";
        moveButton.addEventListener("click", () => openMove(folder.id));

        const deleteButton = document.createElement("button");
        deleteButton.className = "danger";
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", () => deleteFolder(folder.id));

        actions.append(subButton, renameButton, moveButton, deleteButton);
        item.append(info, actions);

        return item;
    }

    function renderFolders() {
        folderList.innerHTML = "";

        if (!allFolders.length) {
            folderList.innerHTML =
                '<div class="empty">No folders created yet. Create your first folder!</div>';
            return;
        }

        const { children } = buildMaps();
        const rendered = new Set();

        function draw(folder, depth) {
            if (rendered.has(folder.id)) return;

            rendered.add(folder.id);
            folderList.appendChild(buildFolderRow(folder, depth));

            (children.get(folder.id) || []).forEach(child => draw(child, depth + 1));
        }

        (children.get(null) || []).forEach(folder => draw(folder, 0));

        // Safety net: show any folder that could not be reached from the top.
        allFolders.forEach(folder => draw(folder, 0));
    }

    async function loadFolders() {
        try {
            const response = await fetch("/api/folders");

            if (response.status === 401) {
                window.location.href = "/login";
                return;
            }

            const folders = await response.json();

            if (!response.ok) {
                throw new Error(folders.error || "Unable to load folders.");
            }

            allFolders = folders;
            renderFolders();

        } catch (error) {
            showMessage(error.message, "error");
            folderList.innerHTML = "";
        }
    }

    // ---------- create / rename / delete ----------

    async function createFolder(parentId) {
        const isSub = parentId !== null && parentId !== undefined;
        const name = prompt(isSub ? "Enter subfolder name:" : "Enter new folder name:");

        if (!name || !name.trim()) return;

        const payload = { name: name.trim() };

        if (isSub) {
            payload.parent_id = parentId;
        }

        try {
            const response = await fetch("/api/folders", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Folder creation failed.");
            }

            showMessage(result.message, "success");
            loadFolders();

        } catch (error) {
            showMessage(error.message, "error");
        }
    }

    async function renameFolder(id, oldName) {
        const name = prompt("Enter new folder name:", oldName);

        if (!name || !name.trim() || name.trim() === oldName) return;

        try {
            const response = await fetch(`/api/folders/${id}`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name.trim()
                })
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Rename failed.");
            }

            showMessage(result.message, "success");
            loadFolders();

        } catch (error) {
            showMessage(error.message, "error");
        }
    }

    async function deleteFolder(id) {
        if (!confirm("Are you sure you want to delete this empty folder?")) {
            return;
        }

        try {
            const response = await fetch(`/api/folders/${id}`, {
                method: "DELETE"
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Folder deletion failed.");
            }

            showMessage(result.message, "success");
            loadFolders();

        } catch (error) {
            showMessage(error.message, "error");
        }
    }

    // ---------- move a folder under another folder ----------

    function openMove(folderId) {
        const { byId, children } = buildMaps();
        const folder = byId.get(folderId);

        if (!folder) return;

        movingFolderId = folderId;

        const blocked = getDescendantIds(folderId, children);
        blocked.add(folderId);

        document.getElementById("moveFolderName").textContent =
            "Choose the new parent for: " + pathOf(folderId, byId);

        moveParent.innerHTML = "";

        const topOption = document.createElement("option");
        topOption.value = "";
        topOption.textContent = "Top level (no parent)";
        moveParent.appendChild(topOption);

        allFolders
            .filter(f => !blocked.has(f.id))
            .map(f => ({ id: f.id, label: pathOf(f.id, byId) }))
            .sort((a, b) => a.label.localeCompare(b.label))
            .forEach(entry => {
                const option = document.createElement("option");
                option.value = String(entry.id);
                option.textContent = entry.label;
                moveParent.appendChild(option);
            });

        moveParent.value = folder.parent_id === null ? "" : String(folder.parent_id);

        moveModal.classList.add("show");
    }

    function closeMove() {
        moveModal.classList.remove("show");
        movingFolderId = null;
    }

    async function confirmMove() {
        if (movingFolderId === null) return;

        const value = moveParent.value;
        const parentId = value === "" ? null : Number(value);
        const button = document.getElementById("moveConfirm");

        button.disabled = true;

        try {
            const response = await fetch(`/api/folders/${movingFolderId}`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    parent_id: parentId
                })
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Move failed.");
            }

            closeMove();
            showMessage(result.message, "success");
            loadFolders();

        } catch (error) {
            closeMove();
            showMessage(error.message, "error");

        } finally {
            button.disabled = false;
        }
    }

    moveModal.addEventListener("click", event => {
        if (event.target === moveModal) closeMove();
    });

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeMove();
    });

    loadFolders();
</script>
</body>
</html>
