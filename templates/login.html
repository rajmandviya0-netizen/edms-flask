<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EDMS | Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f2f5fa;
            font-family: Arial, sans-serif;
            color: #182338;
        }
        .login-card {
            background: white;
            width: min(360px, calc(100% - 48px));
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 12px 40px #17243b12;
        }
        h1 { margin-top: 0; }
        p { color: #65738b; }
        label { display: block; margin-top: 18px; }
        input {
            box-sizing: border-box;
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border: 1px solid #d7dfeb;
            border-radius: 8px;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            background: #c6402b;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }
        .error { color: #b42318; }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>EDMS<span style="color:#c6402b">.</span></h1>
        <p>Sign in to your document workspace.</p>

        {% for category, message in get_flashed_messages(with_categories=true) %}
            <p class="error">{{ message }}</p>
        {% endfor %}

        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">Username</label>
            <input id="username" name="username"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit">Sign in</button>
        </form>

        <p style="text-align:center; margin-bottom:0;">New here?
            <a href="{{ url_for('auth.signup') }}" style="color:#c6402b;">Create an account</a>
        </p>
    </main>
</body>
</html>
